upstream wger {
    server web:8000;
}

upstream app {
    server app:3000;
}

# Preserve forwarded values from the outer TLS proxy.
# Fallbacks keep local/dev behavior working.
map $http_x_forwarded_proto $proxy_xfp {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $proxy_xfh {
    default $http_x_forwarded_host;
    ""      $host;
}

map $http_x_forwarded_port $proxy_xfp_port {
    default $http_x_forwarded_port;
    ""      $server_port;
}

server {
    listen 80;

    location / {
        proxy_pass http://wger;
        proxy_set_header Host $proxy_xfh;
        proxy_set_header X-Forwarded-Host $proxy_xfh;
        proxy_set_header X-Forwarded-Proto $proxy_xfp;
        proxy_set_header X-Forwarded-Port $proxy_xfp_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    # Proxy to Node app for transformed iCal
    location ~ ^/ical/(?<id>[^/?#]+)$ {
        proxy_pass http://app/$id/ical?username=$arg_username&password=$arg_password;
        proxy_set_header Host $proxy_xfh;
        proxy_set_header X-Forwarded-Host $proxy_xfh;
        proxy_set_header X-Forwarded-Proto $proxy_xfp;
        proxy_set_header X-Forwarded-Port $proxy_xfp_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    location /static/ {
        alias /wger/static/;
    }

    location /media/ {
        alias /wger/media/;
    }

    # Increase max body size to allow for video uploads
    client_max_body_size 100M;
}
